name: ci

# Every push and pull request: vet, race tests (fake harnesses), and the
# static release build (AGENTS.md "Working rules"). No secrets are used.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      # The race detector needs cgo; the release binary below does not.
      - name: test
        run: go test -race -timeout 20m ./...
      - name: static build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/heimdall
